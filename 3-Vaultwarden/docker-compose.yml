version: '3'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      - WEBSOCKET_ENABLED=true
      - DOMAIN=https://192.168.100.206
      - ADMIN_TOKEN=vaultwarden123
    volumes:
      - ./vw-data:/data
    networks:
      - vaultwarden

  nginx:
    image: nginx:latest
    container_name: vaultwarden_proxy
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./nginx/vaultwarden.conf:/etc/nginx/conf.d/vaultwarden.conf:ro
      - ./ssl:/ssl:ro
    depends_on:
      - vaultwarden
    networks:
      - vaultwarden

networks:
  vaultwarden:
    driver: bridge
